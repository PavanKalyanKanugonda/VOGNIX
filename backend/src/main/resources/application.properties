# VOGNIX Application Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# Active profile - defaults to h2-file backed MySQL compatibility mode for out-of-the-box execution
# To use MySQL 8, launch with: --spring.profiles.active=mysql or set SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=default

# Datasource (Persistent H2 in MySQL mode)
spring.datasource.url=${H2_DATASOURCE_URL:jdbc:h2:file:./data/vognixdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security & JWT Configuration (override via JWT_SECRET & JWT_EXPIRATION_MS env vars in production)
vognix.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
vognix.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
vognix.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Razorpay Test Mode credentials. Never commit live or test secrets.
razorpay.key-id=${RAZORPAY_KEY_ID:${RAZORPAY_API_KEY:}}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:${RAZORPAY_SECRET_KEY:}}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
