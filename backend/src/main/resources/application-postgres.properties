# VOGNIX PostgreSQL Profile Configuration (Neon / Cloud Postgres / Local PostgreSQL)
# Launch with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# When DATABASE_URL, POSTGRES_URL, or POSTGRES_JDBC_URL is set in the environment,
# DatabaseEnvironmentPostProcessor also configures PostgreSQL automatically.

spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/vognix_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Serverless-friendly HikariCP pool configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations for PostgreSQL
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.lock-retry-count=60
spring.flyway.locations=classpath:db/postgres
