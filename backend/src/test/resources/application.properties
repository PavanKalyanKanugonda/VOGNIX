# Isolated in-memory H2 (MySQL compatibility mode) for Spring Boot tests
spring.datasource.url=jdbc:h2:mem:vognixtestdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Ensure tests run in Sandbox payment mode by default unless overridden
razorpay.key-id=
razorpay.key-secret=
razorpay.webhook-secret=

# Match main Swagger / JWT / CORS properties
vognix.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
vognix.jwt.expiration-ms=86400000
vognix.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
